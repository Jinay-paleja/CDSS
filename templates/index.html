<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Animated Gradient Background */
            background: linear-gradient(120deg, #4b79a1, #283e51);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            color: white;
            animation: fadeIn 2s ease forwards;
            padding: 20px;
            width: 90%;
            max-width: 650px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 40px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255,255,255,0.35);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Heart Disease Prediction System</h1>
        <p>AI-powered prediction system to help analyze the risk of heart disease using medical parameters.</p>

        <a href="/predict">
            <button class="btn">Predict Now</button>
        </a>
    </div>
</body>
</html>
